services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sinapse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sinapse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sinapse_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-sinapse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sinapse} -d ${POSTGRES_DB:-sinapse}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sinapse-network

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: sinapse-n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - N8N_PORT=5678
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-sinapse-shared-dev-encryption-key-2026}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-America/Sao_Paulo}
      - TZ=${TZ:-America/Sao_Paulo}
      - N8N_PROTOCOL=http
      - N8N_HOST=localhost
      - WEBHOOK_URL=${N8N_BASE_URL:-http://localhost:5678}/
      - N8N_METRICS=false
      - N8N_DIAGNOSTICS_ENABLED=false
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/local-files:/files
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sinapse-network

volumes:
  postgres_data:
    name: sinapse_postgres_data
  n8n_data:
    name: sinapse_n8n_data

networks:
  sinapse-network:
    name: sinapse-network
    driver: bridge
