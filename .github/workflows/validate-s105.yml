name: Validate S1-05 consolidation
on:
  pull_request:
  push:
    branches: [main]
jobs:
  postgres-compatibility:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: s105_test
          POSTGRES_PASSWORD: s105_test_only
          POSTGRES_DB: sinapse_s105_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U s105_test -d sinapse_s105_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      S105_TEST_DATABASE_URL: postgresql://s105_test:s105_test_only@localhost:5432/sinapse_s105_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run test:integration:s105
        working-directory: backend
