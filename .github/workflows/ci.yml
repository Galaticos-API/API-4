name: CI

on:
  push:
    branches:
      - main
      - HT-setup
      - develop
  pull_request:
    branches:
      - main
      - HT-setup
      - develop

jobs:
  validate-environment:
    name: Validate Workflows and Container Setup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install n8n-local-sync
        run: |
          python -m pip install --upgrade pip
          pip install n8n-local-sync

      - name: Validate n8n workflows and secrets
        run: |
          n8n-sync validate

      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
