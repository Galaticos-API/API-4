name: CI

on:
  push:
    branches:
      - main
      - HT-setup
      - develop
  pull_request:
    branches:
      - main
      - HT-setup
      - develop

jobs:
  validate-seed:
    name: Validate curated seed on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: seed_test
          POSTGRES_PASSWORD: seed_test_only
          POSTGRES_DB: sinapse_seed_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seed_test -d sinapse_seed_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: seed_test
      POSTGRES_PASSWORD: seed_test_only
      POSTGRES_DB: sinapse_seed_test
      SEED_TEST_DATABASE_URL: postgresql://seed_test:seed_test_only@localhost:5432/sinapse_seed_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run migrate
        working-directory: backend
      - run: npm run seed:validate
        working-directory: backend
      - run: npm run test:seed
        working-directory: backend
      - name: Test archive cascade on PostgreSQL
        run: node --import tsx --test src/modules/projects/projects.archive.db.test.ts
        working-directory: backend
        env:
          ARCHIVE_TEST_DATABASE_URL: postgresql://seed_test:seed_test_only@localhost:5432/sinapse_seed_test

  validate-environment:
    name: Validate Workflows and Docker Setup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install n8n-local-sync
        run: |
          python -m pip install --upgrade pip
          pip install n8n-local-sync

      - name: Validate n8n workflows and secrets
        run: |
          n8n-sync validate

      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet

  validate-backend:
    name: Build & Typecheck Backend (Node.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Build and Typecheck
        working-directory: backend
        run: npm run build

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Audit production dependencies
        working-directory: backend
        run: npm run audit:security

  validate-frontend:
    name: Build Frontend (React + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Production Assets
        working-directory: frontend
        run: npm run build

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

  validate-ai-service:
    name: Validate AI Service (Python / FastAPI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        working-directory: ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile and check syntax
        working-directory: ai-service
        run: python -m py_compile main.py config.py services/__init__.py services/chunker.py services/ollama_client.py

      - name: Run deterministic AI service tests
        working-directory: ai-service
        run: python -m unittest discover -s tests -v
