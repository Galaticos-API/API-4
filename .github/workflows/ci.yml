name: CI

on:
  push:
    branches:
      - main
      - HT-setup
      - develop
  pull_request:
    branches:
      - main
      - HT-setup
      - develop

jobs:
  validate-environment:
    name: Validate Workflows and Docker Setup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install n8n-local-sync
        run: |
          python -m pip install --upgrade pip
          pip install n8n-local-sync

      - name: Validate n8n workflows and secrets
        run: |
          n8n-sync validate

      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet

  validate-backend:
    name: Build & Typecheck Backend (Node.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Build and Typecheck
        working-directory: backend
        run: npm run build

  validate-frontend:
    name: Build Frontend (React + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Production Assets
        working-directory: frontend
        run: npm run build

  validate-ai-service:
    name: Validate AI Service (Python / FastAPI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        working-directory: ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile and check syntax
        working-directory: ai-service
        run: python -m py_compile main.py config.py services/__init__.py services/chunker.py services/ollama_client.py
