name: CI

on:
  push:
    branches:
      - main
      - HT-setup
      - develop
  pull_request:
    branches:
      - main
      - HT-setup
      - develop

jobs:
  validate-windows-dev-scripts:
    name: Validate Windows development scripts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate startup failures and isolated process shutdown
        shell: powershell
        run: ./scripts/test-dev-process.ps1

  validate-environment:
    name: Validate Workflows and Docker Setup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install n8n-local-sync
        run: |
          python -m pip install --upgrade pip
          pip install n8n-local-sync

      - name: Validate n8n workflows and secrets
        run: |
          n8n-sync validate

      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          AI_SERVICE_TOKEN=ci-compose-validation-only DOCUMENT_INGESTION_TOKEN=ci-validation-placeholder-32-characters docker compose config --quiet
          AI_SERVICE_TOKEN=ci-compose-validation-only DOCUMENT_INGESTION_TOKEN=ci-validation-placeholder-32-characters docker compose -f docker-compose.yml -f docker-compose.local-ai.yml --profile local-ai config --quiet

  validate-backend:
    name: Build & Typecheck Backend (Node.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Build and Typecheck
        working-directory: backend
        run: npm run build

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Run backend PostgreSQL integration tests
        working-directory: backend
        timeout-minutes: 10
        run: npm run test:integration:postgres

      - name: Validate versioned AI harness with isolated services
        run: |
          docker build -t sinapse-s209-ai-test ai-service
          cd backend
          npm run test:integration:harness

      - name: Audit production dependencies
        working-directory: backend
        run: npm run audit:security

  validate-frontend:
    name: Build Frontend (React + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Production Assets
        working-directory: frontend
        run: npm run build

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

  validate-ai-service:
    name: Validate AI Service (Python / FastAPI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        working-directory: ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile and check syntax
        working-directory: ai-service
        run: python -m py_compile main.py config.py services/__init__.py services/chunker.py services/ollama_client.py

      - name: Run deterministic AI service tests
        working-directory: ai-service
        run: python -m unittest discover -s tests -v
